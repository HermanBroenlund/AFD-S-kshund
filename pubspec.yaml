name: afd_sokshund
description: AFD Søkshund - operativt verktøy for søk, trening, hunder, kalender og historikk.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.0
  geolocator: ^14.1.1
  image_picker: ^1.2.3
  table_calendar: ^3.2.1
  intl: ^0.20.2
  http: ^1.6.0
  path_provider: ^2.1.6
  pdf: ^3.13.1
  printing: ^5.14.2
  share_plus: ^13.3.0
  archive: ^4.0.7
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/afd_sokshund_logo.png
